name: Deploy to Homelab

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Render stack.env from secrets
        env:
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          OAUTH_REDIRECT_URL: ${{ secrets.OAUTH_REDIRECT_URL }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          OIDC_ISSUER_URL: ${{ secrets.OIDC_ISSUER_URL }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          QUICK_ADD_TOKEN: ${{ secrets.QUICK_ADD_TOKEN }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_MODEL: ${{ secrets.PERPLEXITY_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          keys=(
            COOKIE_DOMAIN OAUTH_REDIRECT_URL HOST_PORT
            OIDC_ISSUER_URL OIDC_CLIENT_ID OIDC_CLIENT_SECRET COOKIE_SECRET
            ALLOWED_EMAILS QUICK_ADD_TOKEN
            AI_PROVIDER ANTHROPIC_API_KEY ANTHROPIC_MODEL
            PERPLEXITY_API_KEY PERPLEXITY_MODEL
            GEMINI_API_KEY GEMINI_MODEL
            OPENAI_API_KEY OPENAI_MODEL
            UNSPLASH_ACCESS_KEY
            VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT
          )
          : > stack.env
          for key in "${keys[@]}"; do
            printf '%s=%s\n' "$key" "${!key}" >> stack.env
          done
          # Sanity-Check ohne Secret-Werte zu leaken
          echo "Rendered $(wc -l < stack.env) lines into stack.env"

      - name: Copy compose + env to LXC
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.prod.yml,stack.env"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            chmod 600 stack.env
            docker compose -f docker-compose.prod.yml --env-file stack.env pull
            docker compose -f docker-compose.prod.yml --env-file stack.env up -d --remove-orphans
            docker image prune -f
