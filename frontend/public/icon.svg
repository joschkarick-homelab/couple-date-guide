<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background: deep lavender night sky -->
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.85">
      <stop offset="0%" stop-color="#3a2f5c"/>
      <stop offset="60%" stop-color="#241c3a"/>
      <stop offset="100%" stop-color="#15102a"/>
    </radialGradient>

    <!-- Moon: warm cream with subtle glow -->
    <radialGradient id="moon" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="70%" stop-color="#f3d9a6"/>
      <stop offset="100%" stop-color="#d9b478"/>
    </radialGradient>
    <filter id="moonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Heart: lavender to peach gradient -->
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a3e8"/>
      <stop offset="50%" stop-color="#f5a9c4"/>
      <stop offset="100%" stop-color="#ffc99a"/>
    </linearGradient>
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star shape -->
    <symbol id="star" viewBox="-10 -10 20 20">
      <path d="M0 -9 L2.6 -2.6 L9 -1 L4 3.5 L5.5 9.5 L0 6.2 L-5.5 9.5 L-4 3.5 L-9 -1 L-2.6 -2.6 Z" fill="#fff5e0"/>
    </symbol>
  </defs>

  <!-- Background panel with iOS-style rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Crescent moon, top right -->
  <g filter="url(#moonGlow)">
    <circle cx="370" cy="150" r="64" fill="url(#moon)"/>
    <circle cx="395" cy="135" r="58" fill="#241c3a"/>
  </g>

  <!-- Scattered stars -->
  <use href="#star" x="110" y="100" width="16" height="16" opacity="0.9"/>
  <use href="#star" x="180" y="180" width="10" height="10" opacity="0.7"/>
  <use href="#star" x="80"  y="200" width="12" height="12" opacity="0.8"/>
  <use href="#star" x="430" y="240" width="11" height="11" opacity="0.7"/>
  <use href="#star" x="450" y="320" width="9"  height="9"  opacity="0.6"/>
  <use href="#star" x="60"  y="320" width="10" height="10" opacity="0.7"/>

  <!-- Central heart, slightly tilted, with soft glow -->
  <g transform="translate(256 320) rotate(-6) scale(1.05)" filter="url(#heartGlow)">
    <path d="M0 88
             L -98 -10
             a 60 60 0 1 1 98 -60
             a 60 60 0 1 1 98 60
             Z"
          fill="url(#heart)"/>
    <!-- Highlight sheen -->
    <path d="M -70 -38
             a 50 50 0 0 1 70 -22"
          stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
